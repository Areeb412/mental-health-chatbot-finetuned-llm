[project]
name = "mental-health-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "datasets==2.21.0",
    "torch>=2.5.1",
    "torchaudio>=2.5.1",
    "torchvision>=0.20.1",
    "transformers>=5.7.0",
    "flask>=3.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "sentencepiece>=0.1.99",
    "tokenizers>=0.13.0",
]



[project.optional-dependencies]
# Dev-only tools — not shipped to users
dev = [
    "pytest>=8.0.0",    # Testing framework
    "black>=24.0.0",    # Code formatter
    "ruff>=0.3.0",      # Ultra-fast linter (replaces flake8)
    "gunicorn>=21.0.0",  # Production WSGI server
]

[build-system]
# Required boilerplate for Python packaging
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
# Black formatter: 88 chars is the modern standard
line-length = 88

[tool.ruff]
# Ruff linter: catches bugs and style issues
line-length = 88
select = ["E", "F", "W", "I"]   # Error, pyFlakes, Warning, Import sorting
