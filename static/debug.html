<!DOCTYPE html>
<html>
<head>
    <title>Chat Debug Test</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; margin: 5px; }
        textarea { width: 100%; padding: 10px; }
    </style>
</head>
<body>
    <h1>🧠 Chat Debug Test</h1>
    
    <div class="test">
        <h3>Test 1: Element Detection</h3>
        <p id="test1">Checking if DOM elements exist...</p>
    </div>
    
    <div class="test">
        <h3>Test 2: Send Message</h3>
        <textarea id="debugInput" placeholder="Type a message..."></textarea>
        <button onclick="testSendMessage()">Send Test Message</button>
        <p id="test2"></p>
    </div>
    
    <div class="test">
        <h3>Test 3: Direct API Call</h3>
        <button onclick="testAPI()">Call /get Endpoint</button>
        <p id="test3"></p>
    </div>
    
    <div class="test">
        <h3>Console Output</h3>
        <pre id="console" style="background: #f5f5f5; padding: 10px; height: 200px; overflow-y: auto;"></pre>
    </div>

    <script>
        const log = (msg) => {
            const pre = document.getElementById('console');
            pre.textContent += msg + '\n';
            pre.scrollTop = pre.scrollHeight;
        };

        // Test 1: Check elements
        window.addEventListener('load', () => {
            log('🔍 Checking DOM elements...');
            
            const elements = {
                'chatMessages': document.getElementById('chatMessages'),
                'userInput': document.getElementById('userInput'),
                'sendBtn': document.getElementById('sendBtn'),
                'typingIndicator': document.getElementById('typingIndicator'),
                'charCount': document.getElementById('charCount'),
                'infoBtn': document.getElementById('infoBtn'),
                'modal': document.getElementById('infoModal'),
            };
            
            let allFound = true;
            for (const [name, elem] of Object.entries(elements)) {
                const status = elem ? '✅' : '❌';
                log(`${status} ${name}`);
                if (!elem) allFound = false;
            }
            
            const result = document.getElementById('test1');
            if (allFound) {
                result.className = 'success';
                result.textContent = '✅ All elements found!';
            } else {
                result.className = 'error';
                result.textContent = '❌ Some elements missing - this might be why!';
            }
        });

        async function testSendMessage() {
            log('📤 Testing send message...');
            const msg = document.getElementById('debugInput').value;
            
            if (!msg) {
                log('❌ Empty message');
                return;
            }
            
            try {
                const response = await fetch('/get', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ msg: msg }),
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                log('✅ Message sent successfully!');
                log('Response: ' + data.response);
                document.getElementById('test2').className = 'success';
                document.getElementById('test2').textContent = '✅ Message sent! Check console.';
            } catch (error) {
                log('❌ Error: ' + error.message);
                document.getElementById('test2').className = 'error';
                document.getElementById('test2').textContent = '❌ Error: ' + error.message;
            }
        }

        async function testAPI() {
            log('📡 Calling /get endpoint...');
            try {
                const response = await fetch('/get', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ msg: 'API test' }),
                });
                
                log('Status: ' + response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                log('✅ API works!');
                log('Response: ' + data.response);
                document.getElementById('test3').className = 'success';
                document.getElementById('test3').textContent = '✅ API working! Response received.';
            } catch (error) {
                log('❌ API Error: ' + error.message);
                document.getElementById('test3').className = 'error';
                document.getElementById('test3').textContent = '❌ API Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
